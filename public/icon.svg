<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#9d174d" />
      <stop offset="100%" stop-color="#4c0519" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ca8a04" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Ornate Border Ring -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="8 6" opacity="0.6"/>
  <circle cx="256" cy="256" r="202" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.4"/>

  <!-- Stylized Paisley / Saree Pallu & Lotus Motif -->
  <g transform="translate(256,256) scale(1.15)" filter="url(#goldGlow)">
    <!-- Central Lotus / Mandala Blossom -->
    <path d="M 0 -85 C 35 -50 45 -10 0 35 C -45 -10 -35 -50 0 -85 Z" fill="url(#goldGrad)" />
    <path d="M -30 -60 C -10 -40 -5 10 -45 25 C -70 5 -55 -35 -30 -60 Z" fill="url(#goldGrad)" opacity="0.85" />
    <path d="M 30 -60 C 10 -40 5 10 45 25 C 70 5 55 -35 30 -60 Z" fill="url(#goldGrad)" opacity="0.85" />
    <path d="M -60 -25 C -40 -15 -20 30 -65 50 C -85 30 -80 -5 -60 -25 Z" fill="url(#goldGrad)" opacity="0.7" />
    <path d="M 60 -25 C 40 -15 20 30 65 50 C 85 30 80 -5 60 -25 Z" fill="url(#goldGrad)" opacity="0.7" />

    <!-- Paisley arch flourish -->
    <path d="M 0 45 C 50 45 80 85 45 110 C 20 125 -30 115 -50 90 C -65 70 -50 45 0 45 Z" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
    <circle cx="0" cy="80" r="12" fill="url(#goldGrad)" />
    <circle cx="0" cy="-20" r="7" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Brand Typography Arc or Text -->
  <text x="256" y="445" font-family="'Cormorant Garamond', Georgia, serif" font-size="42" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="6">AARA</text>
  <text x="256" y="475" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="500" fill="#fde047" text-anchor="middle" letter-spacing="4" opacity="0.9">HERITAGE ATELIER</text>
</svg>
